<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 작성 | JB 게시판</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/write.js" defer></script>
</head>
<body>
  <header>
    <a href="index.html" aria-label="게시판 홈">JB 게시판</a>
    <nav aria-label="주 메뉴">
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="index.html#posts">게시판</a></li>
        <li><a href="#about">소개</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="write-page" aria-labelledby="write-title">
      <h1 id="write-title">게시글 작성</h1>
      <p class="write-description">게시판에 공유할 내용을 작성해주세요.</p>

      <form id="write-form" class="write-form" novalidate>
        <div class="write-field">
          <label for="category">카테고리</label>
          <select id="category" name="category">
            <option value="">카테고리를 선택하세요</option>
            <option value="공지">공지</option>
            <option value="자유">자유</option>
            <option value="질문">질문</option>
            <option value="정보 공유">정보 공유</option>
          </select>
        </div>

        <div class="write-field">
          <label for="author">작성자</label>
          <input id="author" name="author" type="text" placeholder="작성자 이름을 입력하세요">
        </div>

        <div class="write-field">
          <label for="title">제목</label>
          <input id="title" name="title" type="text" placeholder="제목을 입력하세요">
        </div>

        <div class="write-field">
          <label for="content">내용</label>
          <textarea id="content" name="content" rows="10" placeholder="게시글 내용을 입력하세요"></textarea>
        </div>

        <p id="form-message" class="form-message" role="alert" hidden></p>
        <div class="write-actions">
          <a class="cancel-link" href="index.html">취소</a>
          <button type="submit">등록하기</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
